[workspace]
resolver = "2"
members = [
    "crates/widget-actions",
    "crates/widget-matrix-backend",
    "crates/widget-host-driver",
    "crates/widget-base-sdk",
    "crates/uniffi-bindgen",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "Apache-2.0"
repository = "https://github.com/element-hq/matrix-widget-tools-sdk"

[workspace.dependencies]
widget-actions = { path = "crates/widget-actions", version = "0.1.0" }
widget-matrix-backend = { path = "crates/widget-matrix-backend", version = "0.1.0" }
widget-host-driver = { path = "crates/widget-host-driver", version = "0.1.0" }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
uuid = { version = "1.27", features = ["v4"] }
async-trait = "0.1"
futures-channel = "0.3"
futures = "0.3"
uniffi = { version = "=0.31" }

wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4"
serde-wasm-bindgen = "0.6"
js-sys = "0.3"
web-sys = "0.3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
