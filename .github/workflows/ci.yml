name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Run by hand (Actions → CI → Run workflow). On `main` this also deploys the dev site again.
  workflow_dispatch:

# Read only; the deploy job below asks for what GitHub Pages needs.
permissions:
  contents: read

# One run per branch at a time: a newer push to a pull request cancels the older run; on `main`
# runs queue, so an older run can never deploy the dev site after a newer one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --features uniffi -p widget-host-driver
      - run: cargo build --target wasm32-unknown-unknown -p widget-base-sdk
      # The crates release.yml publishes package and build on their own (RELEASING.md).
      - run: cargo publish --dry-run -p widget-actions -p widget-logging -p widget-matrix-backend -p widget-host-driver

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Toolchains, npm ci, wasm, host bindings, matrix-rust-sdk bindings (shared with release.yml).
      - id: setup
        uses: ./.github/actions/setup-web
      # A freshly built matrix-rust-sdk package, to download from the run's summary page.
      - if: steps.setup.outputs.sdk-bindings-built == 'true'
        run: npm pack -w packages/matrix-sdk-uniffi-js --pack-destination "$RUNNER_TEMP"
      - if: steps.setup.outputs.sdk-bindings-built == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: matrix-sdk-uniffi-js
          path: ${{ runner.temp }}/matrix-sdk-uniffi-js-*.tgz
      - run: npm run build --workspaces --if-present
      - run: npm test
      # The npm packages as release.yml publishes them (scripts/pack-npm.mjs), checked like a
      # consumer sees them: publint, types for bundler and node16 resolution, and a fresh Vite app
      # that installs and builds them (scripts/smoke-npm.mjs).
      - run: npm run pack:npm
      - name: Lint the npm packages
        run: |
          for tgz in dist/npm/*.tgz; do
            npx --yes publint@0.3.25 "$tgz"
          done
          for tgz in dist/npm/matrix-widget-sdk-widget-*.tgz dist/npm/matrix-widget-sdk-host-*.tgz; do
            npx --yes @arethetypeswrong/cli@0.18.2 "$tgz" --profile esm-only
          done
      - run: npm run smoke:npm
      - uses: actions/upload-artifact@v4
        with:
          name: npm-packages
          path: dist/npm/*.tgz
          if-no-files-found: error
          retention-days: 14
      # Every story has a row in e2e/stories.md, every story id named in docs and tests exists,
      # sketch stories follow their rules (packages/widget-host/e2e/tools/stories.mjs; no server).
      - run: npm run stories -w @matrix-widget-tools/widget-host
      # The dev site: both host builds and the test widgets under one path (scripts/build-dev-site.mjs).
      # Built on every run, so a pull request also checks that the sub-path build works.
      - name: Build the dev site
        run: npm run build:dev-site
        env:
          SITE_BASE: ${{ vars.DEV_SITE_BASE || format('/{0}/', github.event.repository.name) }}
      - name: Upload the dev site (download it from the run's summary page)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: dev-site
          path: dist/dev-site
          retention-days: 7
      - name: Upload the dev site for GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DEPLOY_DEV_SITE == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/dev-site

  # Deploys the dev site to GitHub Pages. Off until the maintainer turns it on: it runs only on
  # `main` and only when the repository variable DEPLOY_DEV_SITE is `true` (README.md, "Dev site").
  deploy-dev-site:
    needs: [test, web]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DEPLOY_DEV_SITE == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # One deployment at a time; one that started is finished, a newer waiting run replaces an older one.
    concurrency:
      group: dev-site-pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
