<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<title>Dev tools disabled · Widget host mockup</title>
<meta name="viewport" content="width=348">
<link rel="stylesheet" href="../../mock.css">
<script>
  // The gallery picks the theme through the URL hash (#theme=light). A leaf with a fixed theme ignores it.
  (function () { var fixed = ""; function apply() { document.documentElement.dataset.theme = fixed || (location.hash.match(/theme=(light|dark)/) || [])[1] || "dark"; } apply(); addEventListener("hashchange", apply); })();
</script>
</head>
<body style="width:348px;height:420px">
<div class="stage " style=""><div class="sidecol"><section class="sidebox "><header class="side-head"><div class="side-title"><b>Settings</b></div><span class="sp"></span><button class="ibtn " title="Close panel" aria-label="Close panel"><svg class="ico " width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></header><div class="side-body"><h4 class="side-h">Appearance</h4>
    <div class="set-row"><div><b>Theme</b><small>Follows the system unless you choose one.</small></div></div>
    <div class="seg" role="radiogroup" aria-label="Theme"><span class="on" role="radio" aria-checked="true">System</span><span role="radio" aria-checked="false">Light</span><span role="radio" aria-checked="false">Dark</span></div>
    <h4 class="side-h">Developer</h4>
    <div class="set-row"><div><b>Enable dev tools</b><small>Tools to inspect and mock what a widget sees.</small></div><button class="toggle " role="switch" aria-checked="false" aria-label="Enable dev tools"><i></i></button></div>
    <p class="hint">While this is off, no dev tool is shown anywhere in the app.</p></div></section></div></div>
</body>
</html>
