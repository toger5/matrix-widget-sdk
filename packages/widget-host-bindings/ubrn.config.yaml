# uniffi-bindgen-react-native (ubrn) configuration, `web` flavour. What `ubrn build web` does: README.md.
rust:
  directory: ../..
  manifestPath: crates/matrix-widget-host-driver/Cargo.toml

bindings:
  ts: src/generated

web:
  manifestPath: rust_modules/wasm/Cargo.toml
  manifestPatchFile: wasm-crate.patch.toml
  wasmCrateName: matrix-widget-host-wasm
  features:
    - uniffi
  target: web
  tsBindings: src/generated
  entrypoint: src/generated/index.web.ts
