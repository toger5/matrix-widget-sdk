[package]
name = "uniffi-bindgen"
description = "Binary that generates Kotlin/Swift/Python bindings for the widget crates"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "uniffi-bindgen"
path = "src/main.rs"

[dependencies]
uniffi = { workspace = true, features = ["cli"] }
