<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 960" width="1200" height="960" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <style>
    text { fill: #1f2937; white-space: pre; }
    .h1 { font-size: 22px; font-weight: 700; }
    .h2 { font-size: 15px; font-weight: 700; }
    .b { font-size: 13px; }
    .bb { font-size: 13px; font-weight: 700; }
    .s { font-size: 12px; fill: #4b5563; }
    .m { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
    .badge { font-size: 11px; font-weight: 700; fill: #ffffff; }
    .num { font-size: 12px; font-weight: 700; fill: #ffffff; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
  </defs>
  <rect width="1200" height="960" fill="#ffffff"/>

  <text x="30" y="42" class="h1">Test host, test widgets and the in-memory store</text>
  <text x="30" y="66" class="s">A complete widget setup inside one browser tab, without a homeserver. npm run dev starts all three: host :5173, compat wrapper :5174, test widgets :5175.</text>

  <!-- ================= host page ================= -->
  <rect x="30" y="86" width="690" height="600" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="50" y="112" class="h2" style="fill:#1d4ed8">packages/widget-host  ·  localhost:5173</text>
  <text x="50" y="131" class="s">minimal browser host, plain DOM, TypeScript on widget-host-bindings (the host crates as UniFFI-wasm)</text>

  <!-- UI -->
  <rect x="50" y="146" width="660" height="150" rx="10" fill="#ffffff" stroke="#9ca3af"/>
  <text x="66" y="170" class="bb">Page UI (= the WidgetHostPlatform)</text>
  <text x="66" y="194" class="b">• widget state event input + <tspan font-weight="700">Load widget</tspan>: m.widget → iframe, legacy → compat wrapper</text>
  <text x="66" y="214" class="b">• capability checklist, or auto-approve; legacy widgets get <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">setAutoApproved(context caps)</tspan></text>
  <text x="66" y="234" class="b">• <tspan font-weight="700">Messages</tspan> log of every envelope in both directions · <tspan font-weight="700">Driver snapshot</tspan></text>
  <text x="66" y="254" class="b">• client_context answers: widget-test-host / light / en</text>
  <text x="66" y="280" class="s">URL params for e2e: ?event=&lt;json&gt;&amp;autoload=1&amp;autoApprove=1&amp;wrapper=&lt;url&gt;</text>

  <!-- driver -->
  <rect x="50" y="316" width="300" height="110" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="66" y="340" class="h2">WidgetHostDriver</text>
  <text x="66" y="362" class="s">the real driver, compiled to wasm</text>
  <text x="66" y="384" class="m">handleMessageFromWidget(json)</text>
  <text x="66" y="402" class="m">sendToWidget → iframe.postMessage</text>
  <text x="66" y="418" class="s">nothing test-specific in here</text>

  <!-- memory store menu -->
  <rect x="380" y="316" width="330" height="110" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
  <text x="396" y="340" class="h2">Memory store menu</text>
  <text x="396" y="362" class="b">• <tspan font-weight="700">Inject event</tspan>: as if it came from sync</text>
  <text x="396" y="380" class="b">• <tspan font-weight="700">Inject to-device</tspan> message</text>
  <text x="396" y="398" class="b">• <tspan font-weight="700">Clear store</tspan> · <tspan font-weight="700">fail sends</tspan> (error replies)</text>
  <text x="396" y="416" class="b">• live view of timeline, state, delayed, to-device</text>

  <!-- backend -->
  <rect x="50" y="450" width="660" height="216" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="66" y="474" class="h2">InMemoryBackend<tspan dx="12" font-size="12" font-weight="400" fill="#4b5563">widget-matrix-backend · plain vectors · one room, one user</tspan></text>
  <rect x="66" y="488" width="200" height="164" rx="8" fill="#ffffff" stroke="#16a34a"/>
  <text x="80" y="510" class="bb">store</text>
  <text x="80" y="530" class="m">timeline: Vec&lt;Event&gt;</text>
  <text x="80" y="548" class="m">state: (type,key)→Event</text>
  <text x="80" y="566" class="m">delayed events</text>
  <text x="80" y="584" class="m">to-device sent</text>
  <text x="80" y="602" class="m">account data</text>
  <text x="80" y="620" class="m">TURN · rtc transports</text>
  <text x="80" y="638" class="m">delegated leaves</text>

  <rect x="282" y="488" width="412" height="164" rx="8" fill="#ffffff" stroke="#16a34a"/>
  <text x="296" y="510" class="bb">behaves like a client would</text>
  <text x="296" y="532" class="b">• sends append to the store and return fake ids</text>
  <text x="296" y="552" class="b">• every stored event notifies live subscriptions, so a</text>
  <text x="310" y="570" class="b">widget sees its own sends echoed, like real sync</text>
  <text x="296" y="590" class="b">• reads (read_events, state, relations) query the store</text>
  <text x="296" y="610" class="b">• subscribe_room hands over the current state at once</text>
  <text x="296" y="630" class="b">• openid: placeholder token; TURN, transports set by tests</text>
  <text x="296" y="646" class="s">nothing leaves the page</text>

  <!-- arrows inside host -->
  <line x1="200" y1="298" x2="200" y2="314" stroke="#374151" stroke-width="1.4" marker-end="url(#arr)" marker-start="url(#arr)"/>
  <line x1="200" y1="428" x2="200" y2="448" stroke="#374151" stroke-width="1.4" marker-end="url(#arr)" marker-start="url(#arr)"/>
  <text x="210" y="443" class="s">MatrixBackend calls / sinks</text>
  <line x1="545" y1="428" x2="545" y2="448" stroke="#ea580c" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="555" y="443" class="s">inject · clear · failSends</text>

  <!-- ================= widgets ================= -->
  <rect x="790" y="86" width="380" height="250" rx="14" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="810" y="112" class="h2" style="fill:#6d28d9">iframe: test-widgets /new/  ·  :5175</text>
  <rect x="1060" y="122" width="96" height="22" rx="11" fill="#7c3aed"/>
  <text x="1108" y="137" class="badge" text-anchor="middle">MSC4412</text>
  <text x="810" y="136" class="s">widget-base-sdk (wasm)</text>
  <text x="810" y="162" class="b">buttons: request_capabilities, content_loaded,</text>
  <text x="810" y="180" class="b">send m.room.message, send state m.room.topic,</text>
  <text x="810" y="198" class="b">read message / topic, matrix_context,</text>
  <text x="810" y="216" class="b">client_context</text>
  <text x="810" y="240" class="b">logs every push: send_event, update_state,</text>
  <text x="810" y="258" class="b">notify_capabilities, to-device, TURN, theme…</text>
  <text x="810" y="282" class="b">state panel: the SDK's view (approved caps)</text>
  <text x="810" y="310" class="s">autostart: requests caps + content_loaded</text>

  <rect x="790" y="360" width="380" height="326" rx="14" fill="#ecfdf5" stroke="#059669" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="810" y="386" class="h2" style="fill:#047857">iframe: compat wrapper  ·  :5174</text>
  <text x="810" y="405" class="s">MSC4412 towards the host, legacy towards the widget</text>
  <rect x="810" y="420" width="340" height="250" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="826" y="444" class="h2">test-widgets /legacy/  ·  :5175</text>
  <rect x="1058" y="454" width="80" height="22" rx="11" fill="#b45309"/>
  <text x="1098" y="469" class="badge" text-anchor="middle">legacy</text>
  <text x="826" y="464" class="s">matrix-widget-api</text>
  <text x="826" y="490" class="b">buttons: start, content_loaded,</text>
  <text x="826" y="508" class="b">renegotiate (MSC2974), send message /</text>
  <text x="826" y="526" class="b">topic, read message / topic, and</text>
  <text x="826" y="544" class="m">org.example.custom</text>
  <text x="826" y="560" class="s">to see the host's unknown-action error</text>
  <text x="826" y="588" class="b">acks and logs send_event, update_state</text>
  <text x="826" y="614" class="b">state panel shows urlParams: the</text>
  <text x="826" y="632" class="b">wrapper's templating result</text>
  <text x="826" y="652" class="s">(userId, baseUrl, parentUrl, …)</text>

  <!-- postMessage -->
  <line x1="722" y1="230" x2="788" y2="230" stroke="#374151" stroke-width="1.6" marker-end="url(#arr)" marker-start="url(#arr)"/>
  <text x="755" y="222" class="s" text-anchor="middle" style="font-size:10.5px">postMessage</text>
  <line x1="722" y1="520" x2="788" y2="520" stroke="#374151" stroke-width="1.6" marker-end="url(#arr)" marker-start="url(#arr)"/>
  <text x="755" y="512" class="s" text-anchor="middle" style="font-size:10.5px">postMessage</text>
  <text x="755" y="542" class="s" text-anchor="middle">or</text>

  <!-- ================= flows ================= -->
  <text x="30" y="724" class="h2">Three round trips through the store</text>

  <rect x="30" y="738" width="370" height="150" rx="10" fill="#ffffff" stroke="#16a34a"/>
  <circle cx="52" cy="760" r="12" fill="#16a34a"/><text x="52" y="764" class="num" text-anchor="middle">1</text>
  <text x="72" y="765" class="bb">Widget sends</text>
  <text x="46" y="790" class="m">send_event → driver checks send.event</text>
  <text x="46" y="808" class="m">→ backend.send_room_event</text>
  <text x="46" y="826" class="m">→ appended to timeline (+ state)</text>
  <text x="46" y="844" class="m">→ reply { room_id, event_id }</text>
  <text x="46" y="862" class="m">→ subscription echoes it back</text>
  <text x="46" y="878" class="s">   as send_event if receive.* was granted</text>

  <rect x="415" y="738" width="370" height="150" rx="10" fill="#ffffff" stroke="#ea580c"/>
  <circle cx="437" cy="760" r="12" fill="#ea580c"/><text x="437" y="764" class="num" text-anchor="middle">2</text>
  <text x="457" y="765" class="bb">Tester injects</text>
  <text x="431" y="790" class="m">Inject event (JSON) → backend.inject</text>
  <text x="431" y="808" class="m">→ stored as if from sync</text>
  <text x="431" y="826" class="m">→ RoomSink → driver filters</text>
  <text x="431" y="844" class="m">→ send_event, and for state</text>
  <text x="431" y="862" class="m">  events also update_state</text>
  <text x="431" y="878" class="s">   shows up in the widget's log</text>

  <rect x="800" y="738" width="370" height="150" rx="10" fill="#ffffff" stroke="#2563eb"/>
  <circle cx="822" cy="760" r="12" fill="#2563eb"/><text x="822" y="764" class="num" text-anchor="middle">3</text>
  <text x="842" y="765" class="bb">Widget reads</text>
  <text x="816" y="790" class="m">read_events m.room.message</text>
  <text x="816" y="808" class="m">→ backend.read_room_events</text>
  <text x="816" y="826" class="m">→ last `limit` from the store</text>
  <text x="816" y="844" class="m">→ filtered by receive.*</text>
  <text x="816" y="862" class="m">→ reply { events }</text>
  <text x="816" y="878" class="s">   approval itself pushes update_state</text>

  <text x="30" y="918" class="b"><tspan font-weight="700">Automated:</tspan> packages/widget-host/test/driver.test.ts drives the bindings end to end; crates/widget-base-sdk/tests/loopback.rs wires WidgetClient ↔ driver ↔</text>
  <text x="30" y="936" class="b">InMemoryBackend in Rust with in-memory queues instead of postMessage. Assertions read the store (timeline(), state(), toDeviceSent()…).</text>
</svg>
