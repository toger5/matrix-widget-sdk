<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" width="1200" height="860" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <style>
    text { fill: #1f2937; white-space: pre; }
    .h1 { font-size: 22px; font-weight: 700; }
    .h2 { font-size: 15px; font-weight: 700; }
    .b { font-size: 13px; }
    .bb { font-size: 13px; font-weight: 700; }
    .s { font-size: 12px; fill: #4b5563; }
    .m { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; }
    .badge { font-size: 11px; font-weight: 700; fill: #ffffff; }
    .num { font-size: 14px; font-weight: 700; fill: #ffffff; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect width="1200" height="860" fill="#ffffff"/>

  <text x="30" y="42" class="h1">Using legacy widgets with the new driver</text>
  <text x="30" y="66" class="s">The client speaks MSC4412 only. A legacy widget is embedded inside the hosted compat wrapper, which translates envelopes and templates the URL.</text>

  <!-- state event + decision -->
  <rect x="30" y="215" width="190" height="96" rx="10" fill="#f9fafb" stroke="#6b7280"/>
  <text x="48" y="241" class="bb">Widget state event</text>
  <text x="48" y="262" class="s">read from the room</text>
  <text x="48" y="282" class="m">type · state_key</text>
  <text x="48" y="299" class="m">content.url · data</text>

  <polygon points="320,213 390,263 320,313 250,263" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="320" y="260" class="bb" text-anchor="middle">event</text>
  <text x="320" y="276" class="bb" text-anchor="middle">type?</text>
  <line x1="220" y1="263" x2="248" y2="263" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="250" y="420" class="s">the only transition code</text>
  <text x="250" y="436" class="s">in the client:</text>
  <text x="250" y="452" class="m">widget-host/src/widgets.ts</text>

  <!-- new branch -->
  <polyline points="320,213 320,145 448,145" fill="none" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="330" y="118" class="m">m.widget</text>
  <text x="330" y="134" class="m">msc4411.widget</text>

  <rect x="450" y="98" width="400" height="94" rx="10" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="470" y="124" class="h2">iframe: content.url</text>
  <rect x="738" y="110" width="100" height="22" rx="11" fill="#7c3aed"/>
  <text x="788" y="125" class="badge" text-anchor="middle">MSC4412</text>
  <text x="470" y="147" class="b">new widget, e.g. on widget-base-sdk</text>
  <text x="470" y="167" class="s">loaded directly, hidden until content_loaded</text>
  <text x="470" y="183" class="s">no template variables in the URL</text>

  <!-- legacy branch -->
  <polyline points="390,263 448,263" fill="none" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="250" y="340" class="s">legacy:</text>
  <text x="250" y="356" class="m">im.vector.modular.widgets</text>

  <rect x="450" y="225" width="430" height="290" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="470" y="251" class="h2">iframe: compat wrapper</text>
  <rect x="768" y="237" width="100" height="22" rx="11" fill="#059669"/>
  <text x="818" y="252" class="badge" text-anchor="middle">MSC4412</text>
  <text x="470" y="273" class="s">packages/widget-compat-wrapper, hosted once, no action logic</text>
  <text x="470" y="293" class="b">• templates the legacy URL from the context actions</text>
  <text x="470" y="312" class="b">• plays the legacy host for the startup handshake</text>
  <text x="470" y="331" class="b">• translates envelopes 1:1, bodies and errors untouched</text>

  <rect x="475" y="350" width="380" height="146" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="495" y="375" class="h2">inner iframe: legacy widget</text>
  <rect x="743" y="362" width="100" height="22" rx="11" fill="#b45309"/>
  <text x="793" y="377" class="badge" text-anchor="middle">legacy</text>
  <text x="495" y="397" class="s">unchanged widget built on matrix-widget-api</text>
  <text x="495" y="419" class="m">?widgetId=…&amp;parentUrl=&lt;wrapper&gt;&amp;userId=@alice…</text>
  <text x="495" y="443" class="s">speaks</text>
  <text x="540" y="443" class="m">{ api: fromWidget | toWidget,</text>
  <text x="540" y="459" class="m">  widgetId, requestId, action, data }</text>
  <text x="495" y="483" class="s">postMessage to its parent, which is now the wrapper</text>

  <!-- driver -->
  <rect x="940" y="98" width="230" height="417" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="958" y="124" class="h2">Client</text>
  <text x="958" y="144" class="m">WidgetHostDriver</text>
  <text x="958" y="160" class="s">one per widget, MSC4412 only</text>
  <line x1="958" y1="175" x2="1152" y2="175" stroke="#93c5fd"/>
  <text x="958" y="198" class="bb">For a wrapped widget:</text>
  <text x="958" y="219" class="m">set_auto_approved([</text>
  <text x="958" y="235" class="m">  msc4412.matrix_context,</text>
  <text x="958" y="251" class="m">  msc4412.client_context])</text>
  <text x="958" y="273" class="s">a legacy client handed these</text>
  <text x="958" y="289" class="s">facts over in the URL anyway,</text>
  <text x="958" y="305" class="s">so the user is prompted once,</text>
  <text x="958" y="321" class="s">for the widget's own caps</text>
  <line x1="958" y1="340" x2="1152" y2="340" stroke="#93c5fd"/>
  <text x="958" y="363" class="bb">The client has no</text>
  <text x="958" y="383" class="b">• template engine</text>
  <text x="958" y="403" class="b">• legacy protocol code</text>
  <text x="958" y="423" class="b">• fromWidget / toWidget</text>
  <text x="958" y="455" class="s">versionless messages are</text>
  <text x="958" y="471" class="s">rejected with</text>
  <text x="958" y="487" class="m">DriverError::LegacyWidgetApi</text>

  <!-- links to driver -->
  <line x1="852" y1="138" x2="937" y2="138" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)" marker-start="url(#arr)"/>
  <text x="895" y="130" class="s" text-anchor="middle">v1</text>
  <line x1="882" y1="300" x2="937" y2="300" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)" marker-start="url(#arr)"/>
  <text x="910" y="292" class="s" text-anchor="middle">v1</text>

  <!-- wrapper URL -->
  <text x="30" y="548" class="bb">URL the client embeds for a legacy event (content.url passed untemplated):</text>
  <rect x="30" y="558" width="1140" height="30" rx="6" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="42" y="578" class="m">https://wrapper.example/?legacy_widget_url=&lt;urlencoded content.url&gt;&amp;legacy_widget_id=&lt;state_key&gt;&amp;legacy_wait_for_iframe_load=…&amp;legacy_widget_data=&lt;json&gt;</text>

  <!-- steps -->
  <text x="30" y="626" class="h2">What happens when the wrapper starts</text>

  <rect x="30" y="640" width="270" height="190" rx="10" fill="#ffffff" stroke="#059669"/>
  <circle cx="54" cy="664" r="13" fill="#059669"/><text x="54" y="669" class="num" text-anchor="middle">1</text>
  <text x="76" y="669" class="bb">Bootstrap</text>
  <text x="46" y="694" class="b">wrapper → host:</text>
  <text x="46" y="712" class="m">request_capabilities [</text>
  <text x="46" y="728" class="m">  …msc4412.matrix_context,</text>
  <text x="46" y="744" class="m">  …msc4412.client_context ]</text>
  <text x="46" y="766" class="b">auto-approved by the driver,</text>
  <text x="46" y="784" class="b">host answers</text>
  <text x="46" y="802" class="m">notify_capabilities</text>

  <rect x="320" y="640" width="270" height="190" rx="10" fill="#ffffff" stroke="#059669"/>
  <circle cx="344" cy="664" r="13" fill="#059669"/><text x="344" y="669" class="num" text-anchor="middle">2</text>
  <text x="366" y="669" class="bb">Template + load</text>
  <text x="336" y="694" class="b">asks matrix_context and</text>
  <text x="336" y="712" class="b">client_context, renders</text>
  <text x="336" y="732" class="m">$matrix_user_id  $matrix_room_id</text>
  <text x="336" y="748" class="m">$matrix_display_name  …</text>
  <text x="336" y="764" class="m">$org.matrix.msc2873.client_*</text>
  <text x="336" y="786" class="b">adds widgetId, parentUrl,</text>
  <text x="336" y="804" class="b">loads the inner iframe</text>

  <rect x="610" y="640" width="270" height="190" rx="10" fill="#ffffff" stroke="#059669"/>
  <circle cx="634" cy="664" r="13" fill="#059669"/><text x="634" y="669" class="num" text-anchor="middle">3</text>
  <text x="656" y="669" class="bb">Legacy handshake</text>
  <text x="626" y="694" class="b">wrapper plays the legacy host:</text>
  <text x="626" y="714" class="m">toWidget capabilities</text>
  <text x="626" y="730" class="m">  → request_capabilities</text>
  <text x="626" y="746" class="m">  ← notify_capabilities</text>
  <text x="626" y="768" class="m">supported_api_versions</text>
  <text x="626" y="786" class="b">answered locally;</text>
  <text x="626" y="804" class="m">content_loaded <tspan >sent once</tspan></text>

  <rect x="900" y="640" width="270" height="190" rx="10" fill="#ffffff" stroke="#059669"/>
  <circle cx="924" cy="664" r="13" fill="#059669"/><text x="924" y="669" class="num" text-anchor="middle">4</text>
  <text x="946" y="669" class="bb">Steady state</text>
  <text x="916" y="694" class="b">stateless translation:</text>
  <text x="916" y="714" class="m">api      → source</text>
  <text x="916" y="730" class="m">data     → request</text>
  <text x="916" y="746" class="m">widgetId → dropped, re-added</text>
  <text x="916" y="762" class="m">+ version: "v1"</text>
  <text x="916" y="784" class="b">only action renamed:</text>
  <text x="916" y="802" class="m">msc2974.request_capabilities</text>
  <text x="916" y="818" class="m">  ↔ request_capabilities</text>
</svg>
