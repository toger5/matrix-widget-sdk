<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1170" width="1200" height="1170" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <style>
    text { fill: #1f2937; white-space: pre; }
    .h1 { font-size: 22px; font-weight: 700; }
    .h2 { font-size: 15px; font-weight: 700; }
    .b { font-size: 13px; }
    .bb { font-size: 13px; font-weight: 700; }
    .s { font-size: 12px; fill: #4b5563; }
    .m { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
    .mb { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; font-weight: 700; }
    .badge { font-size: 11px; font-weight: 700; fill: #ffffff; }
    .layer { font-size: 12px; font-weight: 700; letter-spacing: 1px; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect width="1200" height="1170" fill="#ffffff"/>

  <text x="30" y="42" class="h1">widget-actions: wire envelope vs. typed actions</text>
  <text x="30" y="66" class="s">No I/O, no state. Two layers: a generic envelope that always parses, and a typed tree that knows every action. Both sides of the protocol share it.</text>

  <!-- ================= Layer 1 ================= -->
  <rect x="30" y="86" width="1140" height="262" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.3"/>
  <text x="48" y="110" class="layer" style="fill:#15803d">LAYER 1 · WIRE   (wire.rs)</text>

  <rect x="48" y="150" width="140" height="70" rx="8" fill="#ffffff" stroke="#9ca3af"/>
  <text x="118" y="178" class="bb" text-anchor="middle">JSON text</text>
  <text x="118" y="198" class="s" text-anchor="middle">postMessage data</text>
  <line x1="190" y1="185" x2="226" y2="185" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="209" y="206" class="s" text-anchor="middle" style="font-size:10px">parse</text>

  <rect x="230" y="124" width="380" height="208" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="246" y="148" class="mb">struct WireMessage</text>
  <text x="246" y="174" class="m">source:    Source       widget | host</text>
  <text x="246" y="194" class="m">action:    String       any name, also unknown</text>
  <text x="246" y="214" class="m">requestId: String</text>
  <text x="246" y="234" class="m">version:   Option       None ⇒ legacy widget</text>
  <text x="246" y="254" class="m">request:   Option&lt;JsonValue&gt;   raw body</text>
  <text x="246" y="274" class="m">response:  Option&lt;JsonValue&gt;   raw body</text>
  <line x1="246" y1="288" x2="594" y2="288" stroke="#d1d5db"/>
  <text x="246" y="308" class="m">kind() → MessageKind</text>
  <text x="246" y="324" class="s">(source × request|response, never stored)</text>

  <text x="640" y="148" class="bb">What the wire layer is for</text>
  <text x="640" y="172" class="b">• parses every MSC4412 message, whatever the action or body</text>
  <text x="640" y="194" class="b">• version check first: no version ⇒ legacy, before any typing</text>
  <text x="640" y="216" class="b">• replies without knowing the action:</text>
  <text x="656" y="234" class="m">response_to(body) · ack() · error_response_to(err)</text>
  <text x="640" y="256" class="b">• requestId correlation, routing by kind()</text>
  <text x="640" y="278" class="b">• enough for code that only forwards: compat wrapper, logs,</text>
  <text x="656" y="296" class="b">a platform that intercepts an action before the driver</text>
  <text x="640" y="318" class="s">Fails only with ActionError::Malformed (not an envelope at all).</text>

  <!-- transition -->
  <line x1="420" y1="350" x2="420" y2="398" stroke="#374151" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="432" y="368" class="m">Action::from_wire(&amp;msg)</text>
  <text x="432" y="386" class="s">kind() picks the leaf enum, serde reads { "action": …, "request" | "response": … } as a tagged enum</text>

  <!-- ================= Layer 2 ================= -->
  <rect x="30" y="402" width="1140" height="456" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.3"/>
  <text x="48" y="426" class="layer" style="fill:#1d4ed8">LAYER 2 · TYPED   (actions/mod.rs, actions/widget/, actions/host/)</text>

  <rect x="48" y="440" width="300" height="146" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="64" y="464" class="mb">enum Action</text>
  <text x="64" y="486" class="m">WidgetRequest  { request }</text>
  <text x="64" y="506" class="m">WidgetResponse { response }</text>
  <text x="64" y="526" class="m">HostRequest    { request }</text>
  <text x="64" y="546" class="m">HostResponse   { response }</text>
  <text x="64" y="572" class="s">one-call entry point for any message</text>

  <text x="48" y="614" class="bb">Leaf enum conventions</text>
  <text x="48" y="636" class="b">• internally tagged on "action"</text>
  <text x="48" y="656" class="b">• one variant per action:</text>
  <text x="64" y="674" class="m">#[serde(rename = "org.matrix.</text>
  <text x="64" y="690" class="m">  msc2876.read_events",</text>
  <text x="64" y="706" class="m">  alias = "read_events")]</text>
  <text x="48" y="728" class="b">• unit variant when the body is {}</text>
  <text x="48" y="750" class="b">• #[serde(other)] Unknown catches</text>
  <text x="64" y="768" class="b">unknown action names only</text>
  <text x="48" y="790" class="b">• known action + bad body</text>
  <text x="64" y="808" class="b">⇒ ActionError::InvalidBody</text>
  <text x="48" y="832" class="s">one file per action, body types inside</text>

  <!-- 2x2 grid -->
  <text x="560" y="452" class="bb" text-anchor="middle">message has "request"</text>
  <text x="900" y="452" class="bb" text-anchor="middle">message has "response"</text>
  <text x="380" y="560" class="bb" text-anchor="middle" transform="rotate(-90 380 560)">source: "widget"</text>
  <text x="380" y="750" class="bb" text-anchor="middle" transform="rotate(-90 380 750)">source: "host"</text>

  <!-- WidgetRequest -->
  <rect x="395" y="464" width="330" height="186" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="411" y="488" class="mb">WidgetRequest</text>
  <text x="560" y="488" class="s">widget asks the host</text>
  <text x="411" y="510" class="b">travels widget → host</text>
  <text x="411" y="530" class="s">built by widget-base-sdk: <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">into_wire(id)</tspan></text>
  <text x="411" y="548" class="s">handled by the driver (match → backend)</text>
  <text x="411" y="572" class="m">ContentLoaded</text>
  <text x="411" y="588" class="m">SendEvent { request: SendEventRequest }</text>
  <text x="411" y="604" class="m">ReadEvents { request: … }  GetOpenId</text>
  <text x="411" y="620" class="m">… 21 actions + Unknown</text>
  <text x="411" y="640" class="s">the bulk of the protocol</text>

  <!-- WidgetResponse -->
  <rect x="735" y="464" width="420" height="186" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="751" y="488" class="mb">WidgetResponse</text>
  <text x="900" y="488" class="s">the host's answer to it</text>
  <text x="751" y="510" class="b">travels host → widget</text>
  <text x="751" y="530" class="s">built by the driver: <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">into_wire_reply(&amp;request)</tspan></text>
  <text x="751" y="548" class="s">handled by widget-base-sdk (resolves the awaited call)</text>
  <text x="751" y="572" class="m">ContentLoaded                    {}</text>
  <text x="751" y="588" class="m">SendEvent { response: SendEventResponse }</text>
  <text x="751" y="604" class="m">GetOpenId { response: GetOpenIdResponse }</text>
  <text x="751" y="620" class="m">… one per request + Unknown</text>
  <text x="751" y="640" class="s">"error" body ⇒ ActionError::ErrorResponse</text>

  <!-- HostRequest -->
  <rect x="395" y="660" width="330" height="186" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="411" y="684" class="mb">HostRequest</text>
  <text x="560" y="684" class="s">host pushes to the widget</text>
  <text x="411" y="706" class="b">travels host → widget</text>
  <text x="411" y="726" class="s">built by the driver: <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">into_wire(uuid)</tspan></text>
  <text x="411" y="744" class="s">handled by widget-base-sdk (callbacks)</text>
  <text x="411" y="768" class="m">NotifyCapabilities  SendEvent { event }</text>
  <text x="411" y="784" class="m">UpdateState  SendToDevice</text>
  <text x="411" y="800" class="m">OpenIdCredentials  UpdateTurnServers</text>
  <text x="411" y="816" class="m">ThemeChange  LanguageChange  Visibility</text>
  <text x="411" y="836" class="s">9 actions + Unknown, fed by sinks / platform</text>

  <!-- HostResponse -->
  <rect x="735" y="660" width="420" height="186" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="751" y="684" class="mb">HostResponse</text>
  <text x="900" y="684" class="s">the widget's acknowledgement</text>
  <text x="751" y="706" class="b">travels widget → host</text>
  <text x="751" y="726" class="s">built by widget-base-sdk: <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">into_wire_reply(&amp;request)</tspan></text>
  <text x="751" y="744" class="s">handled by the driver (clears awaiting_ack)</text>
  <text x="751" y="768" class="m">NotifyCapabilities  SendEvent  UpdateState …</text>
  <text x="751" y="792" class="b">every variant is a unit variant: the body is {}</text>
  <text x="751" y="812" class="s">kept as its own enum so the direction is typed and a</text>
  <text x="751" y="828" class="s">future action can answer with data</text>

  <!-- ================= bottom ================= -->
  <rect x="30" y="878" width="560" height="270" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="1.3"/>
  <text x="48" y="904" class="h2">Why both a WireMessage and an Action?</text>
  <text x="48" y="930" class="bb">1. Answer anything.</text>
  <text x="66" y="948" class="b">An error reply needs requestId / source / action even when the</text>
  <text x="66" y="966" class="b">body is invalid or the action unknown. Only the wire layer has them.</text>
  <text x="48" y="992" class="bb">2. Transport vs. meaning.</text>
  <text x="66" y="1010" class="b">Version, id, direction live in the envelope; the driver and the</text>
  <text x="66" y="1028" class="b">client do one exhaustive match on typed bodies.</text>
  <text x="48" y="1054" class="bb">3. Unknown stays usable.</text>
  <text x="66" y="1072" class="b">Unknown + the raw WireMessage lets a platform layer actions on</text>
  <text x="66" y="1090" class="b">(e.g. upload_file) without touching this crate.</text>
  <text x="48" y="1116" class="bb">4. Different errors.</text>
  <text x="66" y="1134" class="b">Malformed (drop) ≠ InvalidBody (reply with error) ≠ Unknown (reply).</text>

  <rect x="610" y="878" width="560" height="270" rx="12" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.3"/>
  <text x="628" y="904" class="h2">Why four leaf enums?</text>
  <text x="628" y="930" class="b"><tspan font-weight="700">source + action</tspan> identifies a message type, not action alone:</text>
  <text x="644" y="950" class="m">WidgetRequest::SendEvent</text>
  <text x="844" y="950" class="s">"please send this event"</text>
  <text x="644" y="968" class="m">HostRequest::SendEvent</text>
  <text x="844" y="968" class="s">"an event arrived for you"</text>
  <text x="628" y="990" class="b">share the wire name send_event but are different types.</text>
  <text x="628" y="1018" class="b"><tspan font-weight="700">request vs. response</tspan> have different bodies for the same</text>
  <text x="628" y="1036" class="b">action, so each direction gets its own serde enum.</text>
  <text x="628" y="1064" class="b"><tspan font-weight="700">source</tspan> names the initiator and is the same on request and</text>
  <text x="628" y="1082" class="b">response: a WidgetResponse travels host → widget.</text>
  <text x="628" y="1110" class="bb">Adding an action</text>
  <text x="628" y="1130" class="m">actions/&lt;source&gt;/&lt;action&gt;.rs  →  variant(s) in mod.rs  →  re-export</text>
</svg>
