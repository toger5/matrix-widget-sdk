<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1060" width="1200" height="1060" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <style>
    text { fill: #1f2937; white-space: pre; }
    .h1 { font-size: 22px; font-weight: 700; }
    .h2 { font-size: 15px; font-weight: 700; }
    .b { font-size: 13px; }
    .bb { font-size: 13px; font-weight: 700; }
    .s { font-size: 12px; fill: #4b5563; }
    .m { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
    .big { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 17px; font-weight: 700; }
    .num { font-size: 13px; font-weight: 700; fill: #ffffff; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect width="1200" height="1060" fill="#ffffff"/>

  <text x="30" y="42" class="h1">Capabilities and how the actions use them</text>
  <text x="30" y="66" class="s">A capability is a string on the wire and a Capability enum in code (capabilities.rs). The driver holds the approved set and checks it on every request and every push.</text>

  <!-- ================= anatomy ================= -->
  <text x="30" y="104" class="h2">1 · Anatomy of a capability string</text>
  <rect x="30" y="118" width="76" height="38" rx="6" fill="#fee2e2" stroke="#dc2626"/>
  <text x="68" y="142" class="big" style="font-size:15px" text-anchor="middle">widget:</text>
  <rect x="110" y="118" width="184" height="38" rx="6" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="202" y="142" class="big" style="font-size:15px" text-anchor="middle">org.matrix.mscXXXX.</text>
  <rect x="298" y="118" width="104" height="38" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="350" y="142" class="big" style="font-size:15px" text-anchor="middle">send_event</text>
  <rect x="406" y="118" width="94" height="38" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="453" y="142" class="big" style="font-size:15px" text-anchor="middle">.timeline</text>
  <rect x="504" y="118" width="210" height="38" rx="6" fill="#fef3c7" stroke="#d97706"/>
  <text x="609" y="142" class="big" style="font-size:15px" text-anchor="middle">:m.room.message#m.text</text>
  <text x="68" y="176" class="s" text-anchor="middle">source</text>
  <text x="202" y="176" class="s" text-anchor="middle">namespace of the action</text>
  <text x="350" y="176" class="s" text-anchor="middle">action name</text>
  <text x="453" y="176" class="s" text-anchor="middle">modifier</text>
  <text x="609" y="176" class="s" text-anchor="middle">data: type, #msgtype or #state_key</text>
  <text x="30" y="198" class="s">source: widget = the widget may send it · host = the host sends it (a subscription). No capability names a room. Below, … stands for the action's namespace.</text>

  <text x="736" y="124" class="b">• namespace + name = the action as sent, so each action</text>
  <text x="750" y="140" class="b">brings its MSC's prefix: <tspan font-family="ui-monospace, Menlo, monospace" font-size="12">widget:org.matrix.msc2931.navigate</tspan></text>
  <text x="736" y="158" class="b">• unstable is <tspan font-weight="700">emitted</tspan>, stable <tspan font-family="ui-monospace, Menlo, monospace">m.</tspan> is <tspan font-weight="700">accepted</tspan>: same value</text>
  <text x="736" y="176" class="b">• parsed into <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">SendEvent { event_type, msgtype }</tspan></text>
  <text x="736" y="194" class="b">• other strings (legacy names, another namespace) survive</text>
  <text x="750" y="210" class="b">as <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">Capability::Other { raw }</tspan> and grant nothing</text>

  <!-- ================= lifecycle ================= -->
  <text x="30" y="232" class="h2">2 · Negotiation (widget-initiated)</text>

  <rect x="30" y="248" width="200" height="96" rx="8" fill="#f3e8ff" stroke="#7c3aed"/>
  <text x="46" y="272" class="bb">Widget</text>
  <text x="46" y="292" class="m">request_capabilities</text>
  <text x="46" y="308" class="m">{ capabilities: […] }</text>
  <text x="46" y="330" class="s">acked with {} at once</text>

  <line x1="232" y1="296" x2="268" y2="296" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="270" y="248" width="250" height="96" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text x="286" y="272" class="bb">Driver splits the list</text>
  <text x="286" y="294" class="b">in set_auto_approved → granted</text>
  <text x="286" y="314" class="b">the rest joins the open question</text>
  <text x="286" y="334" class="m">on_capabilities_requested</text>

  <line x1="522" y1="296" x2="558" y2="296" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="560" y="248" width="190" height="96" rx="8" fill="#ffedd5" stroke="#ea580c"/>
  <text x="576" y="272" class="bb">Client UI</text>
  <text x="576" y="294" class="b">asks the user, then</text>
  <text x="576" y="314" class="m">driver.approve_</text>
  <text x="576" y="330" class="m">  capabilities(list)</text>

  <line x1="752" y1="296" x2="788" y2="296" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="790" y="248" width="380" height="96" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text x="806" y="272" class="bb">Driver grants requested ∩ (approved ∪ auto)</text>
  <text x="806" y="292" class="b">adds them to the approved set, sends the full list:</text>
  <text x="806" y="310" class="m">update_capabilities { allowed }</text>
  <text x="806" y="332" class="b">and if the set grew: <tspan font-family="ui-monospace, Menlo, monospace" font-size="12">resubscribe()</tspan> (see 4)</text>

  <text x="30" y="370" class="s">Asking again later runs the same round. Only the host takes capabilities away: revoke_capabilities or a single use → update_capabilities with the shorter list. Never requested ⇒ never granted.</text>

  <!-- ================= gates ================= -->
  <text x="30" y="412" class="h2">3 · How a request is gated</text>
  <text x="270" y="412" class="s">a failed check is answered with an error: code org.matrix.msc4412.missing_capability, message "Missing capability: …"</text>

  <!-- card A -->
  <rect x="30" y="426" width="270" height="290" rx="10" fill="#f9fafb" stroke="#9ca3af"/>
  <circle cx="52" cy="450" r="12" fill="#6b7280"/><text x="52" y="455" class="num" text-anchor="middle">A</text>
  <text x="72" y="455" class="bb">No capability</text>
  <text x="46" y="482" class="m">notify_ready</text>
  <text x="46" y="500" class="m">request_capabilities</text>
  <text x="46" y="518" class="m">update_capabilities</text>
  <text x="46" y="540" class="s">the MSC4412 core actions: they work</text>
  <text x="46" y="556" class="s">before any capability exists</text>
  <text x="46" y="584" class="s">replies need none either: they are</text>
  <text x="46" y="600" class="s">part of the action they answer</text>
  <text x="46" y="628" class="bb">Single use</text>
  <text x="46" y="648" class="m">set_single_use([GetOpenId])</text>
  <text x="46" y="666" class="s">the request that passes the check</text>
  <text x="46" y="682" class="s">uses it up; update_capabilities</text>
  <text x="46" y="698" class="s">without it follows the reply</text>

  <!-- card B -->
  <rect x="315" y="426" width="270" height="290" rx="10" fill="#f9fafb" stroke="#9ca3af"/>
  <circle cx="337" cy="450" r="12" fill="#6b7280"/><text x="337" y="455" class="num" text-anchor="middle">B</text>
  <text x="357" y="455" class="bb">One capability per action</text>
  <text x="331" y="478" class="m">approved.has(&amp;Capability::X)</text>
  <text x="331" y="498" class="m">widget:…navigate</text>
  <text x="331" y="513" class="m">widget:…set_always_on_screen</text>
  <text x="331" y="528" class="m">widget:…get_openid  (single use)</text>
  <text x="331" y="543" class="m">widget:…get_rtc_transports</text>
  <text x="331" y="558" class="m">widget:…search_user_directory</text>
  <text x="331" y="573" class="m">widget:…get_media_config</text>
  <text x="331" y="588" class="m" style="font-size:11px">widget:…upload_file · …download_file</text>
  <text x="331" y="603" class="m">widget:…get_rtc_livekit_token</text>
  <text x="331" y="618" class="m">widget:…delegate_rtc_livekit_…</text>
  <text x="331" y="633" class="m">widget:…update_delayed_event</text>
  <text x="331" y="648" class="m">widget:…get_matrix_context</text>
  <text x="331" y="663" class="m">widget:…get_client_context</text>
  <text x="331" y="682" class="s">watch / unwatch_turn_servers need</text>
  <text x="331" y="696" class="m">host:…update_turn_servers</text>
  <text x="331" y="710" class="s">capability = source:action, body ignored</text>

  <!-- card C -->
  <rect x="600" y="426" width="570" height="290" rx="10" fill="#f9fafb" stroke="#9ca3af"/>
  <circle cx="622" cy="450" r="12" fill="#6b7280"/><text x="622" y="455" class="num" text-anchor="middle">C</text>
  <text x="642" y="455" class="bb">Typed capability, matched against the request body</text>
  <text x="616" y="478" class="s">CapabilitySet: one allows_* per check. The capabilities below all start with widget:…</text>
  <rect x="616" y="490" width="538" height="24" fill="#eef2ff"/>
  <text x="624" y="507" class="bb">action</text><text x="784" y="507" class="bb">check</text><text x="930" y="507" class="bb">capability</text>
  <text x="624" y="532" class="m" style="font-size:11px">send_event</text>
  <text x="784" y="532" class="m" style="font-size:11px">allows_send(type,</text>
  <text x="784" y="546" class="m" style="font-size:11px">  state_key, msgtype)</text>
  <text x="930" y="532" class="m" style="font-size:11px">send_event.timeline:&lt;t&gt;[#mt]</text>
  <text x="930" y="546" class="m" style="font-size:11px">send_event.state:&lt;t&gt;[#key]</text>
  <text x="624" y="566" class="m" style="font-size:11px">send_to_device</text>
  <text x="784" y="566" class="m" style="font-size:11px">allows_send_to_device</text>
  <text x="930" y="566" class="m" style="font-size:11px">send_to_device:&lt;t&gt;</text>
  <text x="624" y="584" class="m" style="font-size:11px">read_events</text>
  <text x="784" y="584" class="m" style="font-size:11px">allows_read(_type)</text>
  <text x="930" y="584" class="m" style="font-size:11px">read_events.{timeline,state}:&lt;t&gt;</text>
  <text x="624" y="602" class="m" style="font-size:11px">read_relations</text>
  <text x="784" y="602" class="m" style="font-size:11px">allows_read_relation</text>
  <text x="930" y="602" class="m" style="font-size:11px">read_relations:&lt;t&gt;[#mt]</text>
  <text x="624" y="620" class="m" style="font-size:11px">read_room_account_data</text>
  <text x="784" y="620" class="m" style="font-size:11px">allows_read_room_…</text>
  <text x="930" y="620" class="m" style="font-size:11px">read_room_account_data:&lt;t&gt;</text>
  <line x1="616" y1="634" x2="1154" y2="634" stroke="#d1d5db"/>
  <text x="616" y="656" class="bb">Flags held in addition, checked with has():</text>
  <text x="624" y="676" class="m">send_event + delay</text><text x="870" y="676" class="m">→ widget:…send_event.delayed</text>
  <text x="624" y="692" class="m">send_event + sticky_duration_ms</text><text x="870" y="692" class="m">→ widget:…send_event.sticky</text>
  <text x="624" y="708" class="m">room_id / room_ids</text><text x="870" y="708" class="m">→ no capability: own room only</text>

  <!-- ================= receive ================= -->
  <text x="30" y="758" class="h2">4 · host:… capabilities decide what flows to the widget</text>

  <rect x="30" y="774" width="210" height="84" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text x="46" y="798" class="bb">approved set</text>
  <text x="46" y="818" class="m" style="font-size:11px">host:…forward_event.*:&lt;t&gt;</text>
  <text x="46" y="834" class="m" style="font-size:11px">host:…update_state:&lt;t&gt;</text>
  <text x="46" y="850" class="m" style="font-size:11px">host:…forward_to_device:&lt;t&gt;</text>

  <line x1="242" y1="816" x2="278" y2="816" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="280" y="774" width="250" height="84" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text x="296" y="798" class="m" font-weight="700">subjects_for(approved)</text>
  <text x="296" y="818" class="s">forward_event.* → timeline types</text>
  <text x="296" y="834" class="s">update_state → state types</text>
  <text x="296" y="850" class="s">(state keys, msgtypes filtered later)</text>

  <line x1="532" y1="816" x2="568" y2="816" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="570" y="774" width="250" height="84" rx="8" fill="#ffedd5" stroke="#ea580c"/>
  <text x="586" y="798" class="bb">MatrixBackend</text>
  <text x="586" y="818" class="m">subscribe_room(room,</text>
  <text x="586" y="834" class="m">  subjects, sink)</text>
  <text x="586" y="850" class="m">subscribe_to_device(…)</text>

  <line x1="822" y1="816" x2="858" y2="816" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="860" y="774" width="310" height="84" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text x="876" y="798" class="bb">sink → driver filters each item</text>
  <text x="876" y="818" class="m">allows_forward / allows_update_state</text>
  <text x="876" y="836" class="b">→ forward_event / update_state /</text>
  <text x="876" y="852" class="b">   forward_to_device to the widget</text>

  <text x="30" y="890" class="b">Reading is separate: the results of read_events and read_relations are filtered by their own widget:… capabilities, so a widget never sees an event</text>
  <text x="30" y="908" class="b">type, state key or msgtype it was not granted. On approval the backend hands over the current state at once, which reaches the widget as update_state.</text>

  <rect x="30" y="934" width="1140" height="100" rx="10" fill="#fffbeb" stroke="#d97706"/>
  <text x="46" y="960" class="h2">In short</text>
  <text x="46" y="984" class="b">• Capabilities are the only permission model, one (or more) per action: the capability embeds the action's wire name, namespace included.</text>
  <text x="46" y="1004" class="b">• widget:… capabilities gate <tspan font-weight="700">requests</tspan> (widget → host); host:… capabilities gate <tspan font-weight="700">pushes</tspan> (host → widget) and drive the backend subscription.</text>
  <text x="46" y="1024" class="b">• The host side is authoritative: the widget's own copy of the approved set (WidgetClient) is only for its UI.</text>
</svg>
