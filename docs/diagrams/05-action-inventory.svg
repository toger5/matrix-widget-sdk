  <rect x="857" y="370" width="36" height="16" rx="8" fill="#2563eb"/><text x="875" y="382" class="chip" text-anchor="middle" style="font-size:9.5px">H→W</text>
  <rect x="491" y="394" width="416" height="40" rx="6" fill="#ffffff" stroke="#d1d5db"/>
  <text x="501" y="411" class="m">forward_event · update_state</text>
  <text x="501" y="427" class="s" style="font-size:10.5px">host:…forward_event.{timeline,state}:&lt;t&gt; · host:…update_state:&lt;t&gt;</text>
  <rect x="857" y="416" width="36" height="16" rx="8" fill="#2563eb"/><text x="875" y="428" class="chip" text-anchor="middle" style="font-size:9.5px">H→W</text>
