<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1849 790" width="1849" height="790" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <style>
    text { fill: #1f2937; white-space: pre; }
    .h1 { font-size: 22px; font-weight: 700; }
    .h2 { font-size: 15px; font-weight: 700; }
    .b { font-size: 13px; }
    .bb { font-size: 13px; font-weight: 700; }
    .s { font-size: 11.5px; fill: #4b5563; }
    .m { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
    .chip { font-size: 10.5px; font-weight: 700; fill: #ffffff; }
  </style>
  <rect width="1849" height="790" fill="#ffffff"/>
  <text x="30" y="42" class="h1">The actions, grouped</text>
  <text x="30" y="66" class="s" style="font-size:12px">Every action is &lt;namespace&gt;.&lt;name&gt;: a name shown without a namespace is sent as org.matrix.mscXXXX.&lt;name&gt; (Core: org.matrix.msc4412.&lt;name&gt;). "…" in a capability is the namespace of its action. The grouping is a proposal; the code treats all actions the same.</text>
  <rect x="30" y="80" width="40" height="18" rx="9" fill="#7c3aed"/><text x="50" y="93" class="chip" text-anchor="middle">W→H</text><text x="78" y="93" class="s">widget-initiated</text>
  <rect x="190" y="80" width="40" height="18" rx="9" fill="#2563eb"/><text x="210" y="93" class="chip" text-anchor="middle">H→W</text><text x="238" y="93" class="s">host-initiated</text>
  <rect x="340" y="80" width="40" height="18" rx="9" fill="#ffffff" stroke="#6b7280" stroke-width="1.6" stroke-dasharray="6 4"/><text x="388" y="93" class="s">dashed: not implemented or not supported</text>
  <rect x="30" y="110" width="436" height="576" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="46" y="134" class="h2" style="fill:#2563eb">Core</text>
  <text x="46" y="152" class="s">The MSC4412 core actions, sent as org.matrix.msc4412.&lt;name&gt;.</text>
  <rect x="40" y="164" width="416" height="40" rx="6" fill="#ffffff" stroke="#d1d5db"/>
  <text x="50" y="181" class="m">notify_ready</text>
  <text x="50" y="197" class="s">no capability: widget may be shown (host waits 15 s)</text>
  <rect x="406" y="186" width="36" height="16" rx="8" fill="#7c3aed"/><text x="424" y="198" class="chip" text-anchor="middle" style="font-size:9.5px">W→H</text>
  <rect x="40" y="210" width="416" height="40" rx="6" fill="#ffffff" stroke="#d1d5db"/>
  <text x="50" y="227" class="m">request_capabilities</text>
  <text x="50" y="243" class="s">no capability: the widget asks for more, at any time</text>
  <rect x="406" y="232" width="36" height="16" rx="8" fill="#7c3aed"/><text x="424" y="244" class="chip" text-anchor="middle" style="font-size:9.5px">W→H</text>
  <rect x="40" y="256" width="416" height="40" rx="6" fill="#ffffff" stroke="#d1d5db"/>
  <text x="50" y="273" class="m">update_capabilities</text>
  <text x="50" y="289" class="s">{ allowed }: the full list held now; the host may shrink it</text>
  <rect x="406" y="278" width="36" height="16" rx="8" fill="#2563eb"/><text x="424" y="290" class="chip" text-anchor="middle" style="font-size:9.5px">H→W</text>
  <text x="46" y="326" class="bb">Note</text>
  <text x="46" y="346" class="s" style="font-size:12px">These three are all MSC4412 specs, plus the envelope, the error</text>
  <text x="46" y="362" class="s" style="font-size:12px">codes (unknown_action, missing_capability, invalid_request,</text>
  <text x="46" y="378" class="s" style="font-size:12px">unknown) and the 10 s action timeout. Everything else is defined</text>
  <text x="46" y="394" class="s" style="font-size:12px">by other MSCs on top, each action behind a capability.</text>
  <rect x="481" y="110" width="887" height="576" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="497" y="134" class="h2" style="fill:#d97706">Experimental</text>
  <text x="497" y="152" class="s">Implemented and capability-gated, but not specced in MSC4412 yet. Shapes may still change.</text>
  <rect x="491" y="164" width="416" height="40" rx="6" fill="#ffffff" stroke="#d1d5db"/>
  <text x="501" y="181" class="m">send_event</text>
  <text x="501" y="197" class="s">widget:…send_event.timeline:&lt;t&gt;[#mt] · .state:&lt;t&gt;[#key]</text>
  <rect x="857" y="186" width="36" height="16" rx="8" fill="#7c3aed"/><text x="875" y="198" class="chip" text-anchor="middle" style="font-size:9.5px">W→H</text>
  <rect x="491" y="210" width="416" height="40" rx="6" fill="#ffffff" stroke="#d1d5db"/>
  <text x="501" y="227" class="m">send_event + delay</text>
  <text x="501" y="243" class="s">widget:…send_event.delayed · held in addition</text>
  <rect x="857" y="232" width="36" height="16" rx="8" fill="#7c3aed"/><text x="875" y="244" class="chip" text-anchor="middle" style="font-size:9.5px">W→H</text>
  <rect x="491" y="256" width="416" height="40" rx="6" fill="#ffffff" stroke="#d1d5db"/>
