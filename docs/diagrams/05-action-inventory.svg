  <rect x="857" y="554" width="36" height="16" rx="8" fill="#2563eb"/><text x="875" y="566" class="chip" text-anchor="middle" style="font-size:9.5px">H→W</text>
  <rect x="817" y="554" width="36" height="16" rx="8" fill="#7c3aed"/><text x="835" y="566" class="chip" text-anchor="middle" style="font-size:9.5px">W→H</text>
  <rect x="491" y="578" width="416" height="40" rx="6" fill="#ffffff" stroke="#d1d5db"/>
  <text x="501" y="595" class="m">get_openid</text>
