  <rect width="1849" height="790" fill="#ffffff"/>
  <text x="30" y="42" class="h1">The actions, grouped</text>
  <text x="30" y="66" class="s" style="font-size:12px">Wire names and capabilities as the code emits them (unstable prefixes; "…" abbreviates org.matrix.). The grouping is a proposal for the MSC discussion; the code treats all actions the same.</text>
