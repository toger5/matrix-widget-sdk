  <rect x="491" y="302" width="416" height="40" rx="6" fill="#ffffff" stroke="#d1d5db"/>
  <text x="501" y="319" class="m">send_event + sticky_duration_ms</text>
  <text x="501" y="335" class="s">widget:…send_event.sticky · held in addition</text>
  <rect x="857" y="324" width="36" height="16" rx="8" fill="#7c3aed"/><text x="875" y="336" class="chip" text-anchor="middle" style="font-size:9.5px">W→H</text>
