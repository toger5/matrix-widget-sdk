<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1010" width="1200" height="1010" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <style>
    text { fill: #1f2937; white-space: pre; }
    .h1 { font-size: 22px; font-weight: 700; }
    .h2 { font-size: 15px; font-weight: 700; }
    .b { font-size: 13px; }
    .bb { font-size: 13px; font-weight: 700; }
    .s { font-size: 12px; fill: #4b5563; }
    .c { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
    .m { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
    .badge { font-size: 11px; font-weight: 700; fill: #ffffff; }
    .del { fill: #b91c1c; text-decoration: line-through; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>
  <rect width="1200" height="1010" fill="#ffffff"/>

  <text x="30" y="42" class="h1">How the action envelope changed (matrix-widget-api → MSC4412)</text>
  <text x="30" y="66" class="s">Only the envelope changed. Action names and request / response bodies stay as matrix-widget-api defines them; the compat wrapper forwards bodies untouched.</text>

  <!-- column headers -->
  <text x="30" y="104" class="h2">Legacy (matrix-widget-api)</text>
  <text x="680" y="104" class="h2">MSC4412 (this repository)</text>

  <!-- ================= request ================= -->
  <text x="30" y="132" class="bb">Request</text>
  <rect x="30" y="142" width="490" height="168" rx="8" fill="#f9fafb" stroke="#d1d5db"/>
  <rect x="36" y="171" width="478" height="22" rx="3" fill="#fef3c7"/>
  <rect x="36" y="193" width="478" height="22" rx="3" fill="#fee2e2"/>
  <rect x="36" y="259" width="478" height="22" rx="3" fill="#fef3c7"/>
  <text x="46" y="166" class="c">{</text>
  <text x="46" y="188" class="c">  "api": "fromWidget",</text>
  <text x="46" y="210" class="c del">  "widgetId": "clock",</text>
  <text x="46" y="232" class="c">  "requestId": "a1b2",</text>
  <text x="46" y="254" class="c">  "action": "send_event",</text>
  <text x="46" y="276" class="c">  "data": { "type": "m.room.message", … }</text>
  <text x="46" y="298" class="c">}</text>

  <rect x="680" y="142" width="490" height="168" rx="8" fill="#f9fafb" stroke="#d1d5db"/>
  <rect x="686" y="171" width="478" height="22" rx="3" fill="#fef3c7"/>
  <rect x="686" y="193" width="478" height="22" rx="3" fill="#dcfce7"/>
  <rect x="686" y="259" width="478" height="22" rx="3" fill="#fef3c7"/>
  <text x="696" y="166" class="c">{</text>
  <text x="696" y="188" class="c">  "source": "widget",</text>
  <text x="696" y="210" class="c">  "version": "v1",</text>
  <text x="696" y="232" class="c">  "requestId": "a1b2",</text>
  <text x="696" y="254" class="c">  "action": "send_event",</text>
  <text x="696" y="276" class="c">  "request": { "type": "m.room.message", … }</text>
  <text x="696" y="298" class="c">}</text>

  <line x1="524" y1="182" x2="676" y2="182" stroke="#6b7280" stroke-width="1.3" marker-end="url(#arr)"/>
  <text x="600" y="176" class="s" text-anchor="middle">renamed</text>
  <text x="600" y="210" class="bb" text-anchor="middle" style="fill:#b91c1c">✕ removed</text>
  <text x="600" y="232" class="s" text-anchor="middle">+ added →</text>
  <line x1="524" y1="270" x2="676" y2="270" stroke="#6b7280" stroke-width="1.3" marker-end="url(#arr)"/>
  <text x="600" y="264" class="s" text-anchor="middle">renamed</text>

  <!-- ================= response ================= -->
  <text x="30" y="344" class="bb">Response (to the same request)</text>
  <rect x="30" y="354" width="490" height="212" rx="8" fill="#f9fafb" stroke="#d1d5db"/>
  <rect x="36" y="471" width="478" height="22" rx="3" fill="#fee2e2"/>
  <text x="46" y="378" class="c">{</text>
  <text x="46" y="400" class="c">  "api": "fromWidget",</text>
  <text x="46" y="422" class="c">  "widgetId": "clock",</text>
  <text x="46" y="444" class="c">  "requestId": "a1b2",</text>
  <text x="46" y="466" class="c">  "action": "send_event",</text>
  <text x="46" y="488" class="c del">  "data": { "type": …, "content": … },</text>
  <text x="46" y="510" class="c">  "response": { "room_id": "!r",</text>
  <text x="46" y="532" class="c">                "event_id": "$ev" }</text>
  <text x="46" y="554" class="c">}</text>

  <rect x="680" y="354" width="490" height="212" rx="8" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="696" y="378" class="c">{</text>
  <text x="696" y="400" class="c">  "source": "widget",</text>
  <text x="696" y="422" class="c">  "version": "v1",</text>
  <text x="696" y="444" class="c">  "requestId": "a1b2",</text>
  <text x="696" y="466" class="c">  "action": "send_event",</text>
  <text x="696" y="510" class="c">  "response": { "room_id": "!r",</text>
  <text x="696" y="532" class="c">                "event_id": "$ev" }</text>
  <text x="696" y="554" class="c">}</text>
  <text x="696" y="488" class="s">   (request body not echoed)</text>

  <text x="600" y="482" class="bb" text-anchor="middle" style="fill:#b91c1c">✕ echo</text>
  <text x="600" y="498" class="s" text-anchor="middle">dropped</text>
  <text x="600" y="404" class="s" text-anchor="middle">source stays</text>
  <text x="600" y="420" class="s" text-anchor="middle">"widget": it names</text>
  <text x="600" y="436" class="s" text-anchor="middle">the initiator</text>

  <!-- legend -->
  <rect x="30" y="580" width="16" height="16" rx="3" fill="#fef3c7"/><text x="54" y="593" class="s">renamed</text>
  <rect x="130" y="580" width="16" height="16" rx="3" fill="#fee2e2"/><text x="154" y="593" class="s">removed</text>
  <rect x="230" y="580" width="16" height="16" rx="3" fill="#dcfce7"/><text x="254" y="593" class="s">added</text>
  <text x="330" y="593" class="s">Errors are unchanged in both: "response": { "error": { "message", "matrix_api_error"? } }</text>

  <!-- ================= why table ================= -->
  <text x="30" y="636" class="h2">What changed, and why</text>
  <rect x="30" y="648" width="1140" height="30" fill="#f3f4f6"/>
  <text x="42" y="668" class="bb">change</text>
  <text x="440" y="668" class="bb">why</text>

  <g>
    <rect x="30" y="678" width="1140" height="34" fill="#ffffff"/>
    <text x="42" y="700" class="m">api: fromWidget | toWidget → source: widget | host</text>
    <text x="440" y="700" class="b">Names the side that started the exchange, identical on request and response; no more "from/to" reading.</text>
  </g>
  <g>
    <rect x="30" y="712" width="1140" height="34" fill="#f9fafb"/>
    <text x="42" y="734" class="m">widgetId removed</text>
    <text x="440" y="734" class="b">The host already knows the sender (event.source of the iframe) and runs one driver per widget.</text>
  </g>
  <g>
    <rect x="30" y="746" width="1140" height="34" fill="#ffffff"/>
    <text x="42" y="768" class="m">version: "v1" added</text>
    <text x="440" y="768" class="b">Explicit protocol version. No version ⇒ legacy widget ⇒ DriverError::LegacyWidgetApi, host can fall back.</text>
  </g>
  <g>
    <rect x="30" y="780" width="1140" height="34" fill="#f9fafb"/>
    <text x="42" y="802" class="m">data → request</text>
    <text x="440" y="802" class="b">Pairs with response: exactly one of request / response is present, which makes the direction obvious.</text>
  </g>
  <g>
    <rect x="30" y="814" width="1140" height="34" fill="#ffffff"/>
    <text x="42" y="836" class="m">response no longer echoes the request</text>
    <text x="440" y="836" class="b">The header is enough to correlate (requestId); payloads such as event content are not sent back.</text>
  </g>
  <g>
    <rect x="30" y="848" width="1140" height="34" fill="#f9fafb"/>
    <text x="42" y="870" class="m">supported_api_versions, toWidget capabilities</text>
    <text x="440" y="870" class="b">Dropped. version replaces version negotiation; capabilities are widget-initiated (request → notify).</text>
  </g>
  <g>
    <rect x="30" y="882" width="1140" height="34" fill="#ffffff"/>
    <text x="42" y="904" class="m">URL templates ($matrix_user_id …)</text>
    <text x="440" y="904" class="b">Dropped. Replaced by org.matrix.msc4412.matrix_context / client_context: asked for, behind a capability.</text>
  </g>
  <g>
    <rect x="30" y="916" width="1140" height="34" fill="#f9fafb"/>
    <text x="42" y="938" class="m">msc2974.request_capabilities → request_capabilities</text>
    <text x="440" y="938" class="b">The one renamed action. The legacy name is accepted as alias.</text>
  </g>
  <line x1="30" y1="950" x2="1170" y2="950" stroke="#e5e7eb"/>
  <text x="30" y="978" class="s">Unchanged: requestId, action names (the unstable MSC spelling such as org.matrix.msc2876.read_events is emitted, the prefix-less one accepted), bodies, error shape.</text>
</svg>
